<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfc">
<title>15.010 — what would you pay?</title>
<style>
:root{
  --ink:#1a1a1a; --ink-soft:#4a4a4a; --muted:#8a8a8a;
  --line:#e5e5e3; --blue:#2563eb; --blue-dark:#1d4ed8; --green:#0f9d58;
  --bg:#fdfdfc;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:26px 18px 40px}
.card{width:100%;max-width:430px}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:10px}
h1{font-size:25px;line-height:1.22;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.lede{font-size:14.5px;color:var(--ink-soft);margin-bottom:22px}

label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;margin-bottom:16px}
.f-first{flex:1}
.f-init{width:96px}
input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  padding:13px 14px;font-size:17px;outline:none}      /* 17px: iOS zooms below 16 */
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;
  background:#fff;padding:0 14px}
.money:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.money span{font:26px var(--mono);color:var(--muted);margin-right:6px}
.money input{border:none;box-shadow:none;padding:14px 0;font:30px var(--mono);text-align:right}

button{width:100%;border:none;border-radius:10px;background:var(--blue);color:#fff;
  font-size:17px;font-weight:600;padding:16px;cursor:pointer;margin-top:20px}
button:active{background:var(--blue-dark)}
button:disabled{background:#c9cdd3}
.ghost{background:none;color:var(--blue);border:1px solid var(--line);margin-top:10px;font-weight:500}
.ghost:active{background:#f4f4f2}

.msg{margin-top:16px;font-size:14.5px;min-height:22px}
.msg.err{color:#c0392b}
.msg.wait{color:#8a6d1f}
.ask{font-size:17px;font-weight:600;color:var(--ink);margin:14px 0 0}

/* after submitting */
.done{display:none;text-align:center;padding:14px 0}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.done .who{font-size:19px;font-weight:600;margin-bottom:4px}
.done .amt{font:34px var(--mono);color:var(--blue);margin-bottom:10px}
.done .sub{font-size:14px;color:var(--muted)}
body.sent .form{display:none}
body.sent .done{display:block}
</style>
</head>
<body>
<div class="card">

  <div class="form">
    <p class="eyebrow" id="eyebrow">15.010 · Lecture 1</p>
    <h1 id="qTitle">What is the most you would pay for this sandwich?</h1>
    <p class="lede" id="qLede">It is 11:45 and you have fifteen minutes to eat before a seminar at noon. There is nowhere else you can get to in time.</p>
    <p class="ask" id="qAsk">What is your willingness to pay?</p>

    <form id="f" autocomplete="off" novalidate>
      <div class="row">
        <div class="f-first">
          <label for="first">First name</label>
          <input id="first" type="text" inputmode="text" autocapitalize="words"
                 autocomplete="given-name" placeholder="Priya" maxlength="24" required>
        </div>
        <div class="f-init">
          <label for="initial">Last initial</label>
          <input id="initial" type="text" inputmode="text" autocapitalize="characters"
                 placeholder="S" maxlength="1">
        </div>
      </div>

      <label for="wtp">The most you would pay</label>
      <div class="money">
        <span>$</span>
        <input id="wtp" type="number" inputmode="decimal" step="0.25" min="0" max="100"
               placeholder="0.00" required>
      </div>

      <button type="submit" id="send">Submit</button>
      <p class="msg" id="msg"></p>
    </form>
  </div>

  <div class="done">
    <div class="tick">✓</div>
    <p class="who" id="doneWho"></p>
    <p class="amt" id="doneAmt"></p>
    <p class="sub">Your answer is on the board.</p>
    <button class="ghost" id="again">Change my answer</button>
  </div>

</div>

<script>
/* Behind the 15010.ai proxy this form is served under a per-section path prefix
   — 15010.ai/L1-A/ rather than the service's own /r/15010 — because every
   section is a separate Render service and the section has to be somewhere in
   the URL. socket.io defaults to <origin>/socket.io, which on the proxy names
   no section and answers nothing, so both the client library and the connection
   have to be told where they really live. Served from Render direct the prefix
   comes out empty and this is exactly the old behaviour.
   document.write, deliberately: the script below runs at parse time and needs
   `io` to already exist. Same-origin, so the parser-blocking rule browsers
   apply to document.written cross-origin scripts does not bite. */
function labPrefix() {
  const p = location.pathname, r = p.indexOf('/r/');
  return r >= 0 ? p.slice(0, r) : p.replace(/\/$/, '');
}
var LAB_PREFIX = labPrefix();
document.write('<scr' + 'ipt src="' + LAB_PREFIX + '/socket.io/socket.io.js"></scr' + 'ipt>');
</script>
<script>
/* One answer per device. The token is what the server keys on, so answering a
   second time replaces the first rather than adding another point to the curve. */
/* ---------------------------------------------------------------------------
   THE TWO QUESTIONS. Round 2 is the same sub with the alternatives taken away,
   which is the point of the exercise: willingness to pay is not a property of
   the sandwich, it moves with what else you could do instead.
   Edit the round 2 wording here and nowhere else.
--------------------------------------------------------------------------- */
const ROUND_TEXT = {
  1: { eyebrow: '15.010 · Lecture 1',
       title: 'What is the most you would pay for this sandwich?',
       lede:  'It is 11:45 and you have fifteen minutes to eat before a seminar at noon. ' +
              'There is nowhere else you can get to in time.' },
  2: { eyebrow: '15.010 · Lecture 1 · Round 2',
       title: 'Now what is the most you would pay?',
       lede:  'Same sandwich, but you have a free hour. Brothers, Chipotle, anywhere else ' +
              'nearby: all of them are open to you.' }
};

const TOKEN_KEY = 'l1-demand-token', ME_KEY = 'l1-demand-me';
/* Storage throws outright in Safari's "block all cookies", in lockdown modes and
   in some in-app browsers (Slack, Canvas, Outlook) -- which is how plenty of
   students will open this link. Unguarded, the whole inline script died here:
   the page still LOOKED perfect, no submit handler was ever attached, and the
   student tapped Submit into nothing and never appeared in the data. */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* fine */ } }
};

let token = store.get(TOKEN_KEY);
if (!token) {
  token = (crypto.randomUUID ? crypto.randomUUID()
                             : String(Date.now()) + Math.random().toString(36).slice(2));
  store.set(TOKEN_KEY, token);
}

const room = (location.pathname.split('/r/')[1] || '15010')
  .toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 12) || '15010';

const $ = id => document.getElementById(id);
const socket = io({ path: LAB_PREFIX + '/socket.io',
                    transports: ['websocket', 'polling'] });

let round = 1;

/* The instructor moves the class on; the phone follows. Whatever the student
   already sent stays on the board under the old round -- this only clears the
   box so the next answer is a fresh one, and puts the new question above it. */
function applyRoundText() {
  const t = ROUND_TEXT[round];
  $('eyebrow').textContent = t.eyebrow;
  $('qTitle').textContent  = t.title;
  $('qLede').textContent   = t.lede;
}

function setRound(n) {
  const next = Number(n) === 2 ? 2 : 1;
  if (next === round) return;
  round = next;
  applyRoundText();
  document.body.classList.remove('sent');
  $('wtp').value = '';
  $('msg').textContent = '';
  $('msg').className = 'msg';
}

socket.on('round', d => { if (d && d.round) setRound(d.round); });

/* The instructor cleared the room. The round may be unchanged, so setRound()
   would return early -- and every phone that had answered would sit on its
   green tick while the board was empty. Force the form back. */
socket.on('reset', d => {
  round = Number(d && d.round) === 2 ? 2 : 1;
  applyRoundText();
  document.body.classList.remove('sent');
  $('wtp').value = '';
  $('msg').textContent = ''; $('msg').className = 'msg';
});

socket.on('connect', () =>
  socket.emit('join', { room, role: 'student' }, ack => { if (ack) setRound(ack.round); }));

// remember who they said they were, so changing an answer is one tap
try {
  const me = JSON.parse(store.get(ME_KEY) || '{}');
  if (me.first) $('first').value = me.first;
  if (me.initial) $('initial').value = me.initial;
} catch (e) { /* ignore */ }

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const first = $('first').value.trim();
  const initial = $('initial').value.trim();
  const wtp = Number($('wtp').value);

  if (!first) return fail('Please put your first name in.');
  // A number input empties .value for "12,50", "$12" or "abc" while still SHOWING
  // the typed text, so "please enter an amount" read as nonsense next to a filled
  // box. Comma decimals catch international students in particular.
  if (!Number.isFinite(wtp) || $('wtp').value === '')
    return fail('Please enter a plain number, using a dot for cents — for example 8.50');
  if (wtp < 0 || wtp > 100) return fail('Anything from $0.00 to $100.00.');

  $('send').disabled = true;
  $('msg').textContent = 'Sending…';
  $('msg').className = 'msg';

  socket.emit('submit', { room, token, first, initial, wtp }, res => {
    $('send').disabled = false;
    if (!res || !res.ok) {
      /* Not a mistake the student can fix: the instructor has simply not opened
         the room yet. Same page, answer still in the box, and no confirmation
         screen -- nothing was recorded, so there is nothing to change later. */
      if (res && res.waiting) return waiting(res.error);
      return fail(res && res.error ? res.error : 'Could not send — try again.');
    }
    /* Confirm FIRST. This write used to come first and could throw, leaving a
       student on "Sending…" forever after an answer the server had accepted. */
    if (res.round && res.round !== round) {
      return fail('The question changed while you were typing — please answer again.');
    }
    $('doneWho').textContent = res.name;
    $('doneAmt').textContent = '$' + Number(res.wtp).toFixed(2);
    document.body.classList.add('sent');
    $('msg').textContent = '';
    store.set(ME_KEY, JSON.stringify({ first, initial }));
  });
});

$('again').addEventListener('click', () => {
  document.body.classList.remove('sent');
  $('wtp').focus();
});

function fail(text) {
  $('msg').textContent = text;
  $('msg').className = 'msg err';
  $('send').disabled = false;
}

/* Same shape as fail(), different tone: nothing has gone wrong, they are early. */
function waiting(text) {
  $('msg').textContent = text;
  $('msg').className = 'msg wait';
  $('send').disabled = false;
}

socket.on('disconnect', () => {
  if (!document.body.classList.contains('sent')) fail('Lost the connection — reconnecting…');
});
socket.on('connect', () => {
  if ($('msg').classList.contains('err')) { $('msg').textContent = ''; $('msg').className = 'msg'; }
});
</script>
</body>
</html>
