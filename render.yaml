# Render Blueprint for the 15.010 interactive-apps monorepo.
# One web service per game backend. Each sets rootDir to its own server folder, and a
# buildFilter so a push only rebuilds the service whose files changed.
services:
  - type: web
    name: l1-demand-server
    env: node
    plan: free
    rootDir: L1-demand/server
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        # the whole folder, not just server/: this service also serves the
        # instructor dashboard (index.html, app.js, styles.css) from one level
        # up, so a dashboard-only edit has to trigger a rebuild too
        - L1-demand/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: "*"
    # Free tier sleeps after 15 min idle and takes 30-60s to wake. Open the
    # dashboard and press "Go live" a couple of minutes before class, or set
    # plan: starter to remove the cold start entirely.

  - type: web
    name: commons-game-server
    env: node
    plan: free
    rootDir: L16-commons-game/server
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - L16-commons-game/server/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: pricing-game
    # The live service (created 2026-11-02 in the course-games workspace, Starter) was made by API with these settings;
    # this entry documents them. One service runs the whole game: the build compiles the React client into
    # client/dist and the server serves it, so there is no Vercel front end any more.
    env: node
    plan: starter
    rootDir: L13-pricing-game
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - L13-pricing-game/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: INSTRUCTOR_KEY   # the secret in the instructor's address; set in the dashboard, never in git
        sync: false
      - key: OPENAI_API_KEY   # optional: the ChatGPT player for an odd number of students
        sync: false

  - type: web
    name: ultimatum-game-server
    env: node
    plan: free
    rootDir: L19-ultimatum/server
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - L19-ultimatum/server/**
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: "*"
